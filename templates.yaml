# Laundry: is the washer/dryer running? Derived from its Emporia circuit power,
# with debounce (delay_on filters standby blips; delay_off bridges the low-power
# phases mid-cycle so a soak/tumble pause doesn't read as "done").
- binary_sensor:
    - name: Washer Running
      unique_id: washer_running
      state: "{{ states('sensor.washer_power_minute_average') | float(0) > 5 }}"
      delay_on: "00:00:20"
      delay_off: "00:01:00"
    - name: Dryer Running
      unique_id: dryer_running
      state: "{{ states('sensor.dryer_power_minute_average') | float(0) > 30 }}"
      delay_on: "00:00:20"
      delay_off: "00:01:00"

- sensor:
    - name: Open Doors and Windows
      unit_of_measurement: ""
      state: "{{ states.binary_sensor | selectattr('attributes.device_class', 'in', ['door', 'window']) | selectattr('state', 'eq', 'on') | list | count }}"  # Counts open (state 'on')
      state_class: measurement  # Allows graphing/history
      icon: >-
        {% set count = states.binary_sensor | selectattr('attributes.device_class', 'in', ['door', 'window']) | selectattr('state', 'eq', 'on') | list | count %}
        {% if count > 0 %} mdi:door-open {% else %} mdi:door-closed {% endif %}  # Dynamic icon
      attributes:
        open_entities: >-
          {{ states.binary_sensor | selectattr('attributes.device_class', 'in', ['door', 'window']) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}  # List of open ones
    # Rejected-chore count, for the pinned "N TO FIX" pill on every sub-view
    - name: Chores Pending
      unique_id: chores_pending
      state: "{{ state_attr('sensor.chores_points', 'pending') | int(0) }}"
# Dinners This Week: pulls events containing "dinner" from the Cozi family calendar
- triggers:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
  actions:
    - action: calendar.get_events
      target:
        entity_id: calendar.the_family_cozi
      data:
        start_date_time: "{{ today_at() }}"
        duration:
          days: 14
      response_variable: agenda
  sensor:
    - name: Dinners This Week
      unique_id: dinners_this_week
      icon: mdi:silverware-fork-knife
      state: >-
        {{ agenda['calendar.the_family_cozi']['events']
           | selectattr('summary', 'search', '(?i)dinner') | list | count }}
      attributes:
        dinners: >-
          {{ agenda['calendar.the_family_cozi']['events']
             | selectattr('summary', 'search', '(?i)dinner') | list }}

# Hourly forecast (next 10h) for the styled bar card
- triggers:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home_2
      data:
        type: hourly
      response_variable: hf
  sensor:
    - name: Hourly Forecast Home
      unique_id: hourly_forecast_home
      state: "{{ hf['weather.forecast_home_2'].forecast | count }}"
      attributes:
        hours: "{{ hf['weather.forecast_home_2'].forecast[:9] }}"

# Today's schedule events (for the custom color-coded day timeline).
# Cozi now comes LIVE from sensor.cozi_live (add-on direct) instead of the
# lagging Google Cozi-mirror calendar; Google still supplies the
# personal (gmail) + football calendars. Re-renders whenever cozi_live updates.
- triggers:
    - trigger: time_pattern
      minutes: "/10"
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
    - trigger: state
      entity_id: sensor.cozi_live
  actions:
    # Only call the calendar service when Google is actually alive. When that
    # integration needs reauth its entities go unavailable AND calendar.get_events
    # stops existing, which used to abort this whole template and freeze the rail
    # on stale data. Skipping the call leaves `cal` undefined; the templates below
    # default it, so Cozi events still render on their own.
    - if:
        - condition: template
          value_template: >
            {{ states('calendar.parent_gmail_com') not in
               ['unavailable', 'unknown', 'none'] }}
      then:
        - action: calendar.get_events
          continue_on_error: true
          target:
            entity_id:
              - calendar.parent_gmail_com
              - calendar.kids_football_games
          data:
            start_date_time: "{{ today_at('00:00') }}"
            duration:
              days: 14
          response_variable: cal
  sensor:
    - name: Today Schedule
      unique_id: today_schedule
      state: >
        {% set cal = cal | default({}, true) %}
        {{ (cal.get('calendar.parent_gmail_com', {}).get('events', []) | length)
         + (cal.get('calendar.kids_football_games', {}).get('events', []) | length)
         + (state_attr('sensor.cozi_live', 'events') | default([], true) | length) }}
      attributes:
        events: >
          {% set cal = cal | default({}, true) %}
          {% set ns = namespace(out=[]) %}
          {% for e in cal.get('calendar.parent_gmail_com', {}).get('events', []) %}
            {% set ns.out = ns.out + [dict(e, cal='dad')] %}
          {% endfor %}
          {% for e in cal.get('calendar.kids_football_games', {}).get('events', []) %}
            {% set ns.out = ns.out + [dict(e, cal='ian')] %}
          {% endfor %}
          {% set ns.out = ns.out + (state_attr('sensor.cozi_live', 'events') | default([], true)) %}
          {# dedupe events that live in both Cozi and a Google calendar (same day +
             title); Google entries come first so their person label + official
             schedule win, and Cozi-only appointments still come through. #}
          {% set seen = namespace(keys=[]) %}
          {% set final = namespace(out=[]) %}
          {% for e in ns.out %}
            {% set t = (e.summary | default('') | regex_replace('^\s*[A-Za-z]+:\s*', '') | lower | trim) %}
            {% set key = (e.start | string)[:10] ~ '|' ~ t %}
            {% if key not in seen.keys %}
              {% set seen.keys = seen.keys + [key] %}
              {% set final.out = final.out + [e] %}
            {% endif %}
          {% endfor %}
          {{ final.out }}
