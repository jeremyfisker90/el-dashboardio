<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floorplan Editor</title>
<style>
  body { font-family:'Segoe UI',Roboto,sans-serif; margin:0; color:#eaf0fa; background:#070b1c;
         background-image:radial-gradient(900px 500px at 20% -10%, rgba(34,211,238,.12), transparent 60%),
                          radial-gradient(800px 600px at 110% 20%, rgba(168,85,247,.10), transparent 60%);
         background-attachment:fixed; user-select:none; }
  .hdr { display:flex; align-items:center; gap:8px; padding:9px 14px;
         border-bottom:1px solid rgba(34,211,238,.25); flex-wrap:wrap; }
  .hdr .title { font-size:16px; font-weight:900; letter-spacing:1px;
                text-shadow:0 0 12px rgba(34,211,238,.6); }
  .tab, .mode { border:1px solid rgba(34,211,238,.4); background:rgba(13,20,44,.7); color:#9fb2d0;
         border-radius:10px; padding:7px 13px; font-size:13px; font-weight:800; cursor:pointer; }
  .tab.on { background:rgba(34,211,238,.18); color:#7ee7f7; box-shadow:0 0 10px rgba(34,211,238,.3); }
  .mode { border-color:rgba(168,85,247,.45); }
  .mode.on { background:rgba(168,85,247,.2); color:#d8b4fe; box-shadow:0 0 10px rgba(168,85,247,.3); }
  .sep { width:1px; height:24px; background:rgba(148,163,184,.25); margin:0 4px; }
  .btn { border:none; border-radius:10px; padding:8px 13px; font-size:13px; font-weight:800; cursor:pointer; }
  .btn.save { background:rgba(34,197,94,.2); color:#86efac; border:1px solid rgba(34,197,94,.6);
              box-shadow:0 0 10px rgba(34,197,94,.25); margin-left:auto; }
  .btn.ghost { background:rgba(255,255,255,.05); color:#9fb2d0; border:1px solid rgba(148,163,184,.3); }
  #saved { font-size:12px; color:#86efac; font-weight:700; min-width:64px; }
  .wrap { display:flex; align-items:stretch; }
  #palette { flex:0 0 205px; max-height:calc(100vh - 56px); overflow-y:auto; padding:10px;
             border-right:1px solid rgba(34,211,238,.18); }
  #palette h4 { margin:10px 4px 6px; font-size:11px; letter-spacing:1px; color:#7ee7f7;
                text-transform:uppercase; }
  .pit { display:flex; align-items:center; gap:8px; padding:6px 8px; margin:3px 0; border-radius:10px;
         background:rgba(13,20,44,.7); border:1px solid rgba(96,165,250,.18); cursor:pointer;
         font-size:12.5px; font-weight:700; }
  .pit:hover { border-color:rgba(34,211,238,.55); box-shadow:0 0 8px rgba(34,211,238,.2); }
  .pit .sw { width:14px; height:14px; border-radius:4px; flex:none; }
  .note { font-size:11px; color:#7d8ca8; line-height:1.5; padding:6px 4px; }
  #stage { flex:1; position:relative; overflow:hidden; }
  #stage svg { display:block; width:100%; height:calc(100vh - 56px); }
  .ctl { position:absolute; right:12px; top:12px; background:rgba(8,12,26,.94);
         border:1px solid rgba(34,211,238,.4); border-radius:14px; padding:10px 12px;
         box-shadow:0 0 14px rgba(34,211,238,.18); display:none; max-width:230px; }
  .ctl.show { display:block; }
  .ctl .nm { font-size:13px; font-weight:900; color:#7ee7f7; margin-bottom:8px; }
  .ctl button { margin:2px; }
  .hint { position:absolute; left:12px; bottom:8px; font-size:11px; color:#7d8ca8; }
  .fur, .room { cursor:grab; }
  .fur.sel polygon { stroke:#22d3ee !important; stroke-width:1.6; }
  .room.sel polygon { stroke:#22d3ee !important; stroke-width:1.8; }
</style>
</head>
<body>
<div class="hdr">
  <div class="title">🏠 FLOORPLAN EDITOR</div>
  <button class="tab on" id="t_floor1" onclick="setFloor('floor1')">1st Floor</button>
  <button class="tab" id="t_floor2" onclick="setFloor('floor2')">2nd Floor</button>
  <button class="tab" id="t_basement" onclick="setFloor('basement')">Basement</button>
  <span class="sep"></span>
  <button class="mode on" id="m_rooms" onclick="setMode('rooms')">🏠 Rooms</button>
  <button class="mode" id="m_furn" onclick="setMode('furn')">🛋️ Furniture</button>
  <button class="btn save" onclick="save()">💾 Save</button><span id="saved"></span>
</div>
<div class="wrap">
  <div id="palette"></div>
  <div id="stage">
    <svg id="cnv" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
    <div class="ctl" id="ctl"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>
<script>
let API = 'http://' + location.hostname + ':5000';
const API_FALLBACK = 'http://192.168.1.226:5000';
const S = 13, THICK = 16, GAP = 0.4;        // px per foot, slab depth, room seam
const TITLES = {floor1: '1st Floor', floor2: '2nd Floor', basement: 'Lower Level'};

const DEFAULT_ROOMS = {
  floor1: [
    ['Office',       0,0,10,12,  '#cdd9e6'], ['Family Room', 10,0,24,12, '#f3ddc0'],
    ['Kitchen',     24,0,34,12,  '#cfe0c3'], ['Laundry',     34,0,40,8,  '#d9e5d6'],
    ['Bath',         0,12,6,17,  '#d5dce3'], ['Hall',       12,12,18,24, '#eae3d2'],
    ['Dining Room', 18,14,27,24, '#e5d0d8'], ['Living Room', 0,19,12,30, '#e8d5c8'],
    ['Foyer',       14,24,20,30, '#e9e2d0'], ['Porch',      10,30,26,34, '#d5dce3'],
    ['Garage',      34,8,48,20,  '#d8d8d8'], ['Garage 3',   38,20,48,31, '#cfcfcf']],
  floor2: [
    ["Ian's Room",   0,0,12,10,  '#e3d3c8'], ['Bath',        0,10,8,15,  '#d5dce3'],
    ["Evan's Room",  0,15,12,24, '#cde3df'], ['Master Bedroom',14,0,30,12,'#cfd8ea'],
    ['Master Bath', 30,0,42,7,   '#d5dce3'], ['Closet',     30,7,42,12,  '#e9e2d0'],
    ['Hall',        12,10,30,15, '#e9e2d0'], ['Open Below', 14,15,26,24, '#efece4'],
    ['Guest & Office',30,15,44,24,'#ddd5e6']],
  basement: [
    ['Steam Room', 0,0,8,10,   '#cfe0dd'], ['Rec Room',   8,0,28,12,  '#f3ddc0'],
    ['Gym',        0,10,14,24, '#cde3df'], ['Hall',      14,12,28,16, '#eae3d2'],
    ['Bath',      14,16,24,24, '#d5dce3'], ['Workshop',  28,0,44,24,  '#d8d8d8']],
};
const ROOM_COLORS = ['#cdd9e6','#f3ddc0','#cfe0c3','#e5d0d8','#e8d5c8','#cde3df','#ddd5e6','#e9e2d0'];

// furniture: name, w(ft), d(ft), h(px), colour
const CATALOG = {
  'Living': [
    ['Sofa', 7, 3, 16, '#8a6f52'], ['Sectional L', 9, 6.5, 16, '#8a6f52'],
    ['Loveseat', 5, 3, 16, '#9c8267'], ['Armchair', 3, 3, 15, '#9c8f7b'],
    ['Coffee table', 4, 2, 9, '#6b543e'], ['TV stand', 6, 1.5, 11, '#574634'],
    ['TV', 5.5, 0.5, 26, '#1c1c22'], ['Bookshelf', 3, 1, 34, '#6a5138'],
    ['Rug', 8, 5, 1.5, '#a35b5b'], ['Plant', 1.5, 1.5, 22, '#3f7d4a'],
    ['Piano', 5, 2, 22, '#1f1f24'], ['Lamp', 1.2, 1.2, 28, '#c9b458']],
  'Kitchen / Dining': [
    ['Dining table', 6, 3.5, 14, '#7e6a4f'], ['Chair', 1.5, 1.5, 14, '#8a745a'],
    ['Island', 6, 3, 17, '#a89880'], ['Counter', 6, 2, 17, '#b5a993'],
    ['Fridge', 3, 2.5, 32, '#d9dee3'], ['Stove', 2.5, 2.5, 17, '#c8ccd0']],
  'Bedroom / Office': [
    ['Bed (queen)', 6.8, 5, 12, '#93aecb'], ['Bed (twin)', 6.5, 3.2, 12, '#93aecb'],
    ['Dresser', 5, 1.6, 16, '#7a5f45'], ['Nightstand', 1.6, 1.6, 12, '#7a5f45'],
    ['Desk', 5, 2.3, 14, '#6d5a44'], ['Office chair', 2, 2, 16, '#3a3f49']],
  'Bath / Utility': [
    ['Toilet', 1.6, 2.3, 14, '#e8e8ee'], ['Tub', 5, 2.5, 11, '#dfe6ec'],
    ['Shower', 3, 3, 30, '#cfd8e2'], ['Vanity', 4, 1.8, 16, '#b5a993'],
    ['Washer', 2.3, 2.3, 18, '#d5dae0'], ['Dryer', 2.3, 2.3, 18, '#d5dae0']],
  'Garage / Gym': [
    ['Car', 15, 6, 26, '#7d8a9c'], ['Workbench', 6, 2, 17, '#6d5a44'],
    ['Treadmill', 6, 2.5, 24, '#4a4f57'], ['Weight rack', 4, 2, 20, '#3c4046'],
    ['Pool table', 8, 4.5, 15, '#2e6b46'], ['Shelving', 4, 1.5, 32, '#6a5138']],
};
const TYPES = {};
for (const grp of Object.values(CATALOG)) for (const t of grp) TYPES[t[0]] = t;

let ROOMS = {}, FURN = {floor1: [], floor2: [], basement: []};
let floor = 'floor1', mode = 'rooms', selRoom = null, selFur = null, nextId = 1;
let view = {minx: 0, miny: 0};

function defaultsRooms(){
  const out = {};
  for (const [f, list] of Object.entries(DEFAULT_ROOMS))
    out[f] = list.map((r, i) => ({id: 'r' + (i + 1) + f, name: r[0], x: r[1], y: r[2],
                                  w: r[3] - r[1], d: r[4] - r[2], color: r[5]}));
  return out;
}

async function api(path, body){
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                      body: JSON.stringify(body)} : {};
  let r;
  try { r = await fetch(API + path, opt); }
  catch(e){ if (API === API_FALLBACK) throw e; API = API_FALLBACK; r = await fetch(API + path, opt); }
  return r.json().catch(() => ({}));
}
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const c = x => Math.max(0, Math.min(255, Math.round(x * f)));
  return 'rgb(' + c(n >> 16) + ',' + c((n >> 8) & 255) + ',' + c(n & 255) + ')';
}
function iso(x, y, z){ return [(x - y) * 0.866 * S, (x + y) * 0.5 * S - (z || 0)]; }
function fmt(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }
function pts(l){ return l.map(fmt).join(' '); }

function prismSvg(x1, y1, x2, y2, z0, z1, fill, sw, cls, id){
  const pTL = iso(x1,y1,z1), pTR = iso(x2,y1,z1), pBR = iso(x2,y2,z1), pBL = iso(x1,y2,z1);
  const bBL = iso(x1,y2,z0), bBR = iso(x2,y2,z0), bTR = iso(x2,y1,z0);
  const st = shade(fill, 0.6);
  return '<g class="' + cls + '" data-id="' + id + '">'
    + '<polygon points="' + pts([pBL,pBR,bBR,bBL]) + '" fill="' + shade(fill,.72) + '" stroke="' + st + '" stroke-width="' + sw + '"/>'
    + '<polygon points="' + pts([pTR,pBR,bBR,bTR]) + '" fill="' + shade(fill,.84) + '" stroke="' + st + '" stroke-width="' + sw + '"/>'
    + '<polygon points="' + pts([pTL,pTR,pBR,pBL]) + '" fill="' + fill + '" stroke="' + st + '" stroke-width="' + sw + '"/>'
    + '</g>';
}

function render(){
  const rooms = ROOMS[floor] || [], furn = FURN[floor] || [];
  // bounds
  let pxs = [];
  for (const r of rooms)
    for (const c of [[r.x,r.y],[r.x+r.w,r.y],[r.x+r.w,r.y+r.d],[r.x,r.y+r.d]]){
      const p = iso(c[0], c[1], 0); pxs.push(p, [p[0], p[1] + THICK]);
    }
  if (!pxs.length) pxs = [[0,0],[400,300]];
  const PAD = 30;
  const minx = Math.min(...pxs.map(p => p[0])) - PAD, maxx = Math.max(...pxs.map(p => p[0])) + PAD;
  const miny = Math.min(...pxs.map(p => p[1])) - PAD - 50, maxy = Math.max(...pxs.map(p => p[1])) + PAD + 40;
  view = {minx, miny};
  const cnv = document.getElementById('cnv');
  cnv.setAttribute('viewBox', '0 0 ' + (maxx - minx).toFixed(0) + ' ' + (maxy - miny).toFixed(0));

  let body = '';
  if (rooms.length){
    const ax1 = Math.min(...rooms.map(r => r.x)) - 1, ay1 = Math.min(...rooms.map(r => r.y)) - 1;
    const ax2 = Math.max(...rooms.map(r => r.x + r.w)) + 1, ay2 = Math.max(...rooms.map(r => r.y + r.d)) + 1;
    body += '<polygon points="' + pts([iso(ax1,ay1,-THICK-6), iso(ax2,ay1,-THICK-6),
      iso(ax2,ay2,-THICK-6), iso(ax1,ay2,-THICK-6)]) + '" fill="#000" opacity="0.08"/>';
  }
  const sortedRooms = [...rooms].sort((a, b) => (a.x + a.y) - (b.x + b.y));
  for (const r of sortedRooms)
    body += prismSvg(r.x + GAP, r.y + GAP, r.x + r.w - GAP, r.y + r.d - GAP, -THICK, 0,
                     r.color, 0.8, 'room' + (mode === 'rooms' && r.id === selRoom ? ' sel' : ''), r.id);
  // labels
  for (const r of rooms){
    const lp = iso(r.x + r.w / 2, r.y + r.d / 2, -3);
    const fs = r.w >= 9 ? 12 : 10;
    r.name.split(' & ').forEach((line, i) => {
      body += '<text transform="translate(' + lp[0].toFixed(1) + ',' + (lp[1] + i * 12).toFixed(1)
        + ')" font-size="' + fs + '" font-weight="600" fill="#5a5245" text-anchor="middle" opacity="0.9" '
        + 'font-family="Segoe UI, Roboto, sans-serif" pointer-events="none">' + line + '</text>';
    });
  }
  // furniture (feet-based, sits on the floor top z=0..h)
  const sortedFur = [...furn].sort((a, b) => (a.u + a.v) - (b.u + b.v));
  for (const it of sortedFur){
    const t = TYPES[it.type]; if (!t) continue;
    let w = t[1] * it.s, d = t[2] * it.s;
    if (it.r % 2){ const tmp = w; w = d; d = tmp; }
    body += prismSvg(it.u, it.v, it.u + w, it.v + d, 0, -t[3] * Math.sqrt(it.s), t[4], 0.5,
                     'fur' + (mode === 'furn' && it.id === selFur ? ' sel' : ''), it.id);
  }
  document.getElementById('world').setAttribute('transform',
    'translate(' + (-minx).toFixed(1) + ',' + (-miny).toFixed(1) + ')');
  document.getElementById('world').innerHTML = body
    + '<text x="' + (minx + 14).toFixed(0) + '" y="' + (miny + 30).toFixed(0) + '" font-size="20" '
    + 'font-weight="700" fill="#8a8272" opacity="0.85" font-family="Segoe UI, Roboto, sans-serif" '
    + 'pointer-events="none">' + TITLES[floor] + '</text>';
  renderCtl();
  document.getElementById('hint').textContent = mode === 'rooms'
    ? 'Drag rooms to move · click to select · use the panel to resize/rename · sizes are in feet'
    : 'Click a palette item to drop it · drag to move · click to select · Save when happy';
}

function renderCtl(){
  const ctl = document.getElementById('ctl');
  if (mode === 'rooms'){
    const r = (ROOMS[floor] || []).find(x => x.id === selRoom);
    ctl.className = 'ctl' + (r ? ' show' : '');
    if (!r) return;
    ctl.innerHTML = '<div class="nm">' + r.name + ' — ' + r.w + '×' + r.d + ' ft</div>'
      + '<button class="btn ghost" onclick="szRoom(1,0)">Wider +1\'</button>'
      + '<button class="btn ghost" onclick="szRoom(-1,0)">Narrower −1\'</button>'
      + '<button class="btn ghost" onclick="szRoom(0,1)">Deeper +1\'</button>'
      + '<button class="btn ghost" onclick="szRoom(0,-1)">Shallower −1\'</button>'
      + '<button class="btn ghost" onclick="renameRoom()">✏️ Rename</button>'
      + '<button class="btn ghost" onclick="recolorRoom()">🎨 Colour</button>'
      + '<button class="btn ghost" style="color:#fda4af" onclick="delRoom()">🗑 Delete</button>';
  } else {
    const it = (FURN[floor] || []).find(x => x.id === selFur);
    ctl.className = 'ctl' + (it ? ' show' : '');
    if (!it) return;
    ctl.innerHTML = '<div class="nm">' + it.type + '</div>'
      + '<button class="btn ghost" onclick="rotFur()">⟳ Rotate</button>'
      + '<button class="btn ghost" onclick="scaleFur(1.15)">＋ Bigger</button>'
      + '<button class="btn ghost" onclick="scaleFur(0.87)">－ Smaller</button>'
      + '<button class="btn ghost" onclick="dupFur()">⧉ Duplicate</button>'
      + '<button class="btn ghost" style="color:#fda4af" onclick="delFur()">🗑 Delete</button>';
  }
}

function setFloor(f){
  floor = f; selRoom = selFur = null;
  for (const t of ['floor1', 'floor2', 'basement'])
    document.getElementById('t_' + t).className = 'tab' + (t === f ? ' on' : '');
  render();
}
function setMode(m){
  mode = m; selRoom = selFur = null;
  document.getElementById('m_rooms').className = 'mode' + (m === 'rooms' ? ' on' : '');
  document.getElementById('m_furn').className = 'mode' + (m === 'furn' ? ' on' : '');
  buildPalette(); render();
}

// ---- room ops
function curRoom(){ return (ROOMS[floor] || []).find(x => x.id === selRoom); }
function szRoom(dw, dd){ const r = curRoom(); if (r){ r.w = Math.max(2, r.w + dw); r.d = Math.max(2, r.d + dd); render(); } }
function renameRoom(){ const r = curRoom(); if (!r) return;
  const n = prompt('Room name:', r.name); if (n !== null && n.trim()){ r.name = n.trim(); render(); } }
function recolorRoom(){ const r = curRoom(); if (!r) return;
  const i = ROOM_COLORS.indexOf(r.color); r.color = ROOM_COLORS[(i + 1) % ROOM_COLORS.length]; render(); }
function delRoom(){ if (!confirm('Delete this room?')) return;
  ROOMS[floor] = (ROOMS[floor] || []).filter(x => x.id !== selRoom); selRoom = null; render(); }
function addRoom(name, w, d, color){
  const r = {id: 'r' + Date.now() + Math.floor(Math.random() * 99), name, x: 2, y: 2, w, d, color};
  ROOMS[floor].push(r); selRoom = r.id; render();
}

// ---- furniture ops
function curFur(){ return (FURN[floor] || []).find(x => x.id === selFur); }
function addFur(type){ const it = {id: nextId++, type, u: 6, v: 6, r: 0, s: 1};
  FURN[floor].push(it); selFur = it.id; render(); }
function rotFur(){ const s = curFur(); if (s){ s.r = (s.r + 1) % 4; render(); } }
function scaleFur(f){ const s = curFur(); if (s){ s.s = Math.max(.4, Math.min(3, s.s * f)); render(); } }
function delFur(){ FURN[floor] = FURN[floor].filter(i => i.id !== selFur); selFur = null; render(); }
function dupFur(){ const s = curFur(); if (s){ const c = {...s, id: nextId++, u: s.u + 1.5, v: s.v + 1.5};
  FURN[floor].push(c); selFur = c.id; render(); } }

// ---- pointer: select + drag (feet)
const cnv = document.getElementById('cnv');
let drag = null;
function svgPoint(ev){
  const pt = cnv.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(cnv.getScreenCTM().inverse());
  return [p.x, p.y];
}
cnv.addEventListener('pointerdown', ev => {
  const cls = mode === 'rooms' ? '.room' : '.fur';
  const g = ev.target.closest(cls);
  if (!g){ selRoom = selFur = null; render(); return; }
  const [x, y] = svgPoint(ev);
  if (mode === 'rooms'){
    selRoom = g.dataset.id;
    const r = curRoom(); drag = {x, y, a: r.x, b: r.y};
  } else {
    selFur = parseInt(g.dataset.id);
    const s = curFur(); drag = {x, y, a: s.u, b: s.v};
  }
  try { cnv.setPointerCapture(ev.pointerId); } catch(e){}
  render();
});
cnv.addEventListener('pointermove', ev => {
  if (!drag) return;
  const [x, y] = svgPoint(ev);
  const dx = x - drag.x, dy = y - drag.y;
  const du = (dx / 0.866 + dy / 0.5) / (2 * S), dv = (-dx / 0.866 + dy / 0.5) / (2 * S);
  if (mode === 'rooms'){
    const r = curRoom(); if (!r) return;
    r.x = Math.round((drag.a + du) * 2) / 2;         // snap to half-foot
    r.y = Math.round((drag.b + dv) * 2) / 2;
  } else {
    const s = curFur(); if (!s) return;
    s.u = drag.a + du; s.v = drag.b + dv;
  }
  render();
});
cnv.addEventListener('pointerup', () => { drag = null; });

async function save(){
  document.getElementById('saved').textContent = '…';
  try { await api('/floorplan', {floors: {rooms: ROOMS, furniture: FURN}});
        document.getElementById('saved').textContent = '✓ saved'; }
  catch(e){ document.getElementById('saved').textContent = '✗ failed'; }
  setTimeout(() => document.getElementById('saved').textContent = '', 2500);
}
async function load(){
  ROOMS = defaultsRooms();
  try {
    const d = await api('/floorplan');
    if (d && d.rooms) ROOMS = {...defaultsRooms(), ...d.rooms};
    if (d && d.furniture) FURN = {floor1: [], floor2: [], basement: [], ...d.furniture};
    else if (d && d.floor1) FURN = {floor1: d.floor1, floor2: d.floor2 || [], basement: d.basement || []};
    let mx = 0;
    for (const f of Object.values(FURN)) for (const i of f) mx = Math.max(mx, i.id || 0);
    nextId = mx + 1;
  } catch(e){}
  render();
}

function buildPalette(){
  const pal = document.getElementById('palette');
  if (mode === 'rooms'){
    pal.innerHTML = '<h4>Add spaces</h4>'
      + '<div class="pit" onclick="addRoom(\'New Room\', 12, 10, \'#cdd9e6\')"><span class="sw" style="background:#cdd9e6"></span>+ Room (12×10)</div>'
      + '<div class="pit" onclick="addRoom(\'Hall\', 12, 4, \'#eae3d2\')"><span class="sw" style="background:#eae3d2"></span>+ Hallway (12×4)</div>'
      + '<div class="pit" onclick="addRoom(\'Closet\', 6, 3, \'#e9e2d0\')"><span class="sw" style="background:#e9e2d0"></span>+ Closet (6×3)</div>'
      + '<div class="pit" onclick="addRoom(\'Stairs\', 4, 10, \'#d5dce3\')"><span class="sw" style="background:#d5dce3"></span>+ Stairs (4×10)</div>'
      + '<div class="note">Drag rooms into place. Select one to resize (per foot), rename, recolour, or delete. '
      + 'Overlaps are fine while arranging — line up edges when you\'re done, then 💾 Save.</div>';
  } else {
    pal.innerHTML = Object.entries(CATALOG).map(([grp, items]) =>
      '<h4>' + grp + '</h4>' + items.map(t =>
        '<div class="pit" onclick="addFur(\'' + t[0].replace(/'/g, "\\'") + '\')">'
        + '<span class="sw" style="background:' + t[4] + '"></span>' + t[0] + '</div>').join('')
    ).join('');
  }
}

buildPalette();
setFloor('floor1');
load();
window.__fp = {ROOMS: () => ROOMS, FURN: () => FURN, addFur, addRoom, save, setFloor, setMode};
</script>
</body>
</html>
